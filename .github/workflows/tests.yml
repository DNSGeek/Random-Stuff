name: Tests
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - '**.py'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: python -m pytest -v
